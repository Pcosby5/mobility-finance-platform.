# Broker config for the Compose container: the consumer and simulator reach it
# over the Compose network (and the host via the published port), so the
# listener cannot be loopback-only like the bare-metal dev config.
# Demo only: unauthenticated on a trusted local network.
listener 1883 0.0.0.0
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
